name: Verify

# Hybrid (solo + multi-machine AI):
# - Daily work: local `dart tool/verify.dart` (no push/PR CI — saves minutes)
# - Weekly safety net: cheap package gate on ubuntu (SDK/dep drift)
# - On demand: workflow_dispatch; platforms only when explicitly enabled
#
#   gh workflow run "Verify"
#   gh workflow run "Verify" -f platforms=true
on:
  schedule:
    # Weekly Mon 00:00 KST (Sun 15:00 UTC) — package job only
    - cron: '0 15 * * 0'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Also build example web + Android debug APK'
        type: boolean
        default: false

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Flutter 3.47 can rewrite a few tracked files during `pub get`; prove
      # the checked-out release input is clean before that tool side effect.
      - name: Clean release input
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - run: flutter pub get

      - name: Package gate
        # Avoid `dart run`: its build hook can modify the worktree before the
        # verifier's clean-HEAD preflight executes. The clean release input
        # was already verified before dependency setup above.
        env:
          VERIFY_CLEAN_WORKTREE_PRECHECKED: 'true'
        run: dart tool/verify.dart

  platforms:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms }}
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter pub get
        working-directory: example

      - name: Build web
        working-directory: example
        run: flutter build web --no-pub

      - name: Build Android debug APK
        working-directory: example
        run: flutter build apk --debug --no-pub
