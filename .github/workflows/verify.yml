name: Verify

# Manual only — vibe default is local: dart run tool/verify.dart
#   gh workflow run "Verify"
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Also build example web + Android debug APK'
        type: boolean
        default: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Local gate
        run: dart run tool/verify.dart

  platforms:
    if: ${{ inputs.platforms }}
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter pub get
        working-directory: example

      - name: Build web
        working-directory: example
        run: flutter build web --no-pub

      - name: Build Android debug APK
        working-directory: example
        run: flutter build apk --debug --no-pub
